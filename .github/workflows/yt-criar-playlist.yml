name: Criar playlist no YouTube
on:
  workflow_dispatch:
    inputs:
      titulo:
        required: true
      descricao:
        required: true
      chave:
        description: "Palavra que identifica a playlist (para não criar repetida)"
        required: true
jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python yt_criar_playlist.py "${{ inputs.titulo }}" "${{ inputs.descricao }}" "${{ inputs.chave }}"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
