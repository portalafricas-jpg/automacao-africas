name: Teste do Reels

# Só monta o vídeo do Resumo do dia com as matérias publicadas hoje. Não publica nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow requests
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python video.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar o vídeo de teste no depósito de mídia (galho midia, apagado após 7 dias)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash guardar_midia.sh "Teste do Reels (vídeo)" ensaio/reels-teste.mp4
