name: Legenda (transcrever)
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Caminho do vídeo no repositório"
        required: true
      saida:
        description: "Onde salvar as palavras (json)"
        required: true
permissions:
  contents: write
jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper
      - run: python legendas.py "${{ inputs.video }}" "${{ inputs.saida }}"
      - run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add "${{ inputs.saida }}"
          git diff --cached --quiet || git commit -m "Transcrição para legenda"
          git pull --rebase && git push
