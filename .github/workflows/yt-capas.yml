name: Trocar capas de vídeos no YouTube
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta com as capas (ID_DO_VIDEO.jpg)"
        required: true
jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python yt_capas.py "${{ github.event.inputs.pasta }}"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
