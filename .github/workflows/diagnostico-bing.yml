name: Diagnóstico do Bing

# Teste do Google Notícias no robô (não publica nada, não grava nada).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura googlenewsdecoder requests
      - name: Testar
        run: |
          python3 - <<'FIM'
          import json
          from datetime import datetime, timezone, timedelta
          import robo
          agora = datetime.now(timezone.utc)
          fontes = [f for f in json.load(open("fontes.json")) if f.get("tipo") == "busca"]
          total, janela, amostra = 0, 0, []
          for f in fontes[:12]:
              f = dict(f); f.pop("dia_semana", None); f["grupo"] = 0
              itens = robo.ler_fonte(f, 0)
              novos = [i for i in itens if i["data"] and agora - i["data"] <= timedelta(hours=3)]
              total += len(itens); janela += len(novos); amostra += novos[:1]
          print(f"TOTAL: {total} notícias, {janela} das últimas 3h (12 buscas)")
          ok = 0
          for i in amostra[:6]:
              real = robo.link_real_google(i["link"])
              m = robo.extrair_materia(real, i["titulo"]) if real else {"texto": "", "veiculo": ""}
              ok += len(m.get("texto", "")) >= 600
              print(f"RES * {i['titulo'][:60]} | {real[:70]} | veículo: {m.get('veiculo')} | texto: {len(m.get('texto',''))}")
          print(f"RES lidas com texto completo: {ok} de {min(6, len(amostra))}")
          FIM
