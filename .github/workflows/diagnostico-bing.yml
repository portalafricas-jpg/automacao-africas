name: Diagnóstico do Bing

# Teste do Google Notícias no robô (não publica nada, não grava nada).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura googlenewsdecoder
      - name: Testar
        run: |
          python3 - <<'FIM'
          import json
          from datetime import datetime, timezone, timedelta
          import robo
          agora = datetime.now(timezone.utc)
          fontes = [f for f in json.load(open("fontes.json")) if f.get("tipo") == "busca"]
          print("buscas na lista:", len(fontes))
          total, janela, amostra = 0, 0, []
          for f in fontes[:12]:
              f = dict(f); f.pop("dia_semana", None); f["grupo"] = 0
              itens = robo.ler_fonte(f, 0)
              novos = [i for i in itens if i["data"] and agora - i["data"] <= timedelta(hours=3)]
              total += len(itens); janela += len(novos)
              print(f"- {f['busca'][:40]:40} | {len(itens):3} notícias | {len(novos):3} das últimas 3h")
              amostra += novos[:1]
          print(f"TOTAL: {total} notícias, {janela} das últimas 3h (12 buscas)")
          print("\nTeste de desembrulhar o link e ler o texto:")
          for i in amostra[:5]:
              real = robo.link_real_google(i["link"])
              m = robo.extrair_materia(real, i["titulo"]) if real else {"texto": "", "veiculo": ""}
              print(f"* {i['titulo'][:60]}\n   link real: {real[:90]}\n   veículo: {m.get('veiculo')} | texto lido: {len(m.get('texto',''))} caracteres")
          FIM
