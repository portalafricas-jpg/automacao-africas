name: Ligar posts antigos do Instagram às matérias

# Roda uma vez (ou quando quiser). Só lê o Instagram e grava feeds/instagram.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: robo-redes

jobs:
  ligar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python instagram_antigos.py
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Guardar a lista
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add feeds/instagram.json
          git commit -m "Posts antigos do Instagram ligados às matérias" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
