name: Ligar posts antigos do Instagram às matérias

# Roda uma vez (ou quando quiser). Só lê o Instagram e grava feeds/instagram.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: robo-redes

jobs:
  ligar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ligar e guardar a lista (refaz se o robô das redes salvar ao mesmo tempo)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python instagram_antigos.py
            git add feeds/instagram.json
            git commit -q -m "Posts antigos do Instagram ligados às matérias" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 20
          done
          exit 1
