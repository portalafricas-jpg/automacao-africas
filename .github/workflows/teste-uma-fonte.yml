name: Testar uma fonte (temporario)
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura anthropic
      - run: pip install googlenewsdecoder
      - run: |
          python - <<'PY'
          import robo as R
          itens=R.ler_rss(R.google_url("site:afro.tv"))
          print("GOOGLE itens:", len(itens))
          for it in itens[:6]: print("  -", it["titulo"][:90])
          import robo
          for it in itens[:3]:
              try:
                  real=R.link_real_google(it["link"]); print("LINK", real)
                  t=R.extrair_materia(real, it["titulo"], "")
                  print("TEXTO", len(t or "") if not isinstance(t,tuple) else [len(str(x)) for x in t])
              except Exception as e: print("ERRO", e)
          PY
