name: Testar uma fonte (temporario)
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura googlenewsdecoder
      - run: |
          python - <<'PY'
          import robo as R
          try:
              t,_=R.baixar("https://billboard.com.br/feed/"); print("FEED BRUTO", len(t), t[:200].replace("\n"," "))
          except Exception as e: print("ERRO FEED", e)
          itens=R.ler_rss(R.google_url("site:billboard.com.br"))
          print("GOOGLE itens:", len(itens))
          for it in itens[:8]: print("  -", it["titulo"][:90])
          for it in itens[:2]:
              try:
                  real=R.link_real_google(it["link"]); t=R.extrair_materia(real, it["titulo"], "")
                  print("TEXTO", real, len(t.get("texto","")))
              except Exception as e: print("ERRO", e)
          PY
