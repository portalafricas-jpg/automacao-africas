name: Robô das redes

# Publica no Instagram (carrossel + story) e no Facebook (álbum + link no 1º comentário).
# Acionado pelo cron-job.org a cada 15 minutos.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pegar os arquivos da pasta
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o editor de imagens, o conector e o editor de vídeo
        run: |
          pip install pillow requests
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Rodar o robô das redes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODO_REDES: publicar
        run: python redes.py

      - name: Salvar a fila e o registro
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add estado/redes.json estado/posts-redes.json feeds/instagram.json assessorias/
          git diff --cached --quiet && exit 0
          git commit -m "Robô das redes: rodada"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
