name: Ajuste semanal das buscas

# Toda segunda às 9h (12h UTC): revê a frequência de cada busca pelos relatórios do robô
# e manda o resumo por e-mail (aviso do GitHub).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: robo-africas
  cancel-in-progress: false

jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests trafilatura googlenewsdecoder
      - run: python ajuste_buscas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "robo-africas"; git config user.email "robo-africas@users.noreply.github.com"
          git add estado/buscas-ajuste.json
          git diff --cached --quiet || git commit -m "Ajuste semanal das buscas"
          git pull --rebase && git push
