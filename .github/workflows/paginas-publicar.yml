name: Publicar páginas de privacidade e termos

# Publica a política de privacidade e os termos de uso no Cloudflare Workers (grátis).
# Exigidas pelo TikTok, Meta e LinkedIn para liberar a publicação pelo robô.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python cloudflare_publicar.py paginas

      - name: Salvar os endereços
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add cloudflare/paginas.json
          git diff --cached --quiet && exit 0
          git commit -m "Páginas: endereços da privacidade e dos termos"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
