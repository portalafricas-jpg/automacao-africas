name: Baixar página do site (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ensaio
          curl -sL -A "Mozilla/5.0" https://www.africas.com.br/termos-de-uso-e-privacidade -o ensaio/termos.html
          curl -sL -A "Mozilla/5.0" https://www.africas.com.br/ -o ensaio/home.html
          git config user.name "robo-africas"; git config user.email "robo-africas@users.noreply.github.com"
          git add -f ensaio/termos.html ensaio/home.html; git commit -m "Páginas do site para a auditoria" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
