name: teste-youtube
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir conexão com o canal
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          dados = urllib.parse.urlencode({"client_id": os.environ["YT_CLIENT_ID"], "client_secret": os.environ["YT_CLIENT_SECRET"], "refresh_token": os.environ["YT_REFRESH_TOKEN"], "grant_type": "refresh_token"}).encode()
          tok = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", dados))["access_token"]
          req = urllib.request.Request("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true", headers={"Authorization": "Bearer " + tok})
          for c in json.load(urllib.request.urlopen(req))["items"]:
              print("CANAL:", c["snippet"]["title"], c["statistics"])
          PY
