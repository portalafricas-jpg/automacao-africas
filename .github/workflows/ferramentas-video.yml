name: Ferramentas de vídeo (transcrição e máscara)

# Roda na mão (a conversa aciona depois de guardar o vídeo no galho "midia").
# Lê os vídeos de video-ferramentas/entrada/ do galho midia e guarda os resultados em
# video-ferramentas/saida/ no mesmo galho (apagados após 7 dias). Não publica nada.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ferramentas-video
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libgles2
          pip install -q faster-whisper mediapipe opencv-python-headless numpy
      - name: Trazer os vídeos de entrada do galho midia
        run: |
          git fetch -q --depth 1 origin midia && git checkout FETCH_HEAD -- video-ferramentas/entrada || echo "Sem entrada no galho midia."
          git reset -q
      - name: Processar vídeos
        run: python video-ferramentas/processar.py
      - name: Salvar resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls video-ferramentas/saida/* >/dev/null 2>&1 || exit 0
          bash guardar_midia.sh "Ferramentas de vídeo: transcrição e máscara" $(cd video-ferramentas/saida && ls | sed 's#^#video-ferramentas/saida/#')
