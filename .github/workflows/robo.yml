name: Robô Áfricas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-africas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Pegar os arquivos da pasta
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o leitor de matérias
        run: pip install trafilatura googlenewsdecoder

      - name: Rodar o robô
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python robo.py

      - name: Matérias da redação (manuais, na hora marcada)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python materia_manual.py

      - name: Salvar os RSS atualizados
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add feeds estado
          git diff --cached --quiet || git commit -m "Robô: atualização dos RSS"
          git pull --rebase
          git push
