name: Baixar capas e quadros dos vídeos (temporário)
on:
  workflow_dispatch:
    inputs:
      videos:
        required: true
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ensaio/capas
          for v in ${{ github.event.inputs.videos }}; do
            for n in maxresdefault maxres1 maxres2 maxres3 hq1 hq2 hq3; do
              curl -sfL "https://i.ytimg.com/vi/$v/$n.jpg" -o "ensaio/capas/${v}_$n.jpg" || rm -f "ensaio/capas/${v}_$n.jpg"
            done
          done
          ls -la ensaio/capas
          git config user.name "robo-africas"; git config user.email "robo-africas@users.noreply.github.com"
          git add -f ensaio/capas; git commit -m "Capas para redesenho" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
