name: Diagnóstico do YouTube

# Só lê os dados do canal e guarda em ensaio/yt-diagnostico.json. Não altera nada no canal.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python yt_diagnostico.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Guardar o diagnóstico na pasta ensaio
        run: |
          git config user.name "robo-africas"
          git config user.email "robo-africas@users.noreply.github.com"
          git add -f ensaio/yt-diagnostico.json
          git commit -m "Diagnóstico do YouTube" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
