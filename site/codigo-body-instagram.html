<!-- Áfricas Play: mostra o post do Instagram na matéria, no lugar do "Siga o Áfricas no Instagram" (lista atualizada pelo robô das redes no GitHub) -->
<script>
(function () {
  var caminho = location.pathname.replace(/\/+/g, "/").replace(/\/$/, "");
  if (caminho.indexOf("/noticia/") !== 0) return;
  fetch("https://raw.githubusercontent.com/portalafricas-jpg/automacao-africas/main/feeds/instagram.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (mapa) {
      var link = mapa[caminho];
      var texto = document.getElementById("content");
      if (!link || !texto) return;
      var caixa = document.createElement("div");
      caixa.style.margin = "28px 0";
      caixa.innerHTML = '<p><strong>Veja também no Instagram do Áfricas Play</strong></p>' +
        '<blockquote class="instagram-media" data-instgrm-permalink="' + link + '" data-instgrm-version="14" ' +
        'style="max-width:540px;width:100%;margin:0 auto;"></blockquote>';
      // 1) no lugar da frase "Siga o Áfricas no Instagram: @africasplay"
      var siga = null;
      var links = texto.querySelectorAll('a[href*="instagram.com/africasplay"]');
      for (var i = 0; i < links.length; i++) {
        var bloco = links[i].closest("p, div");
        if (bloco && bloco !== texto && /Siga o Áfricas/i.test(bloco.textContent)) { siga = bloco; break; }
      }
      if (siga) {
        siga.parentNode.replaceChild(caixa, siga);
      } else {
        // 2) sem a frase: antes do botão do grupo de WhatsApp, ou no fim do texto
        var grupo = texto.querySelector('img[src*="btn-whatsapp"], a[href*="chat.whatsapp.com"]');
        var antes = grupo ? (grupo.closest("p, div, a") || grupo) : null;
        if (antes && antes !== texto && texto.contains(antes)) antes.parentNode.insertBefore(caixa, antes);
        else texto.appendChild(caixa);
      }
      if (window.instgrm) { window.instgrm.Embeds.process(); return; }
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.instagram.com/embed.js";
      document.body.appendChild(s);
    })
    .catch(function () {});
})();
</script>
